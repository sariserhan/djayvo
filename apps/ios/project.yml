name: Jamloom
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    GCC_FAST_MATH: NO
    HEADER_SEARCH_PATHS: $(SRCROOT)/../../core/include
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.6.0
    CURRENT_PROJECT_VERSION: 5
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Jamloom:
    type: application
    platform: iOS
    sources:
      - path: Jamloom
      - path: ../../build-ios-studio/Studio
        type: folder
        buildPhase: resources
      - path: ../web/practice-audio/manifest.json
        buildPhase: resources
      - path: ../../assets/manifests/dna-languages.json
        buildPhase: resources
      - path: ../../assets/manifests/improvise-styles.json
        buildPhase: resources
      - path: ../../assets/licenses
        type: folder
        buildPhase: resources
      - path: ../../core/audio
      - path: ../../core/arrangement
      - path: ../../core/composition
      - path: ../../core/instruments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djayvo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Jamloom/Bridge.h
        INFOPLIST_FILE: Jamloom/Info.plist
        OTHER_LDFLAGS: ['$(inherited)', '-lc++']
    preBuildScripts:
      - name: Prepare shared DJ studio
        script: |
          cd "$SRCROOT/../.."
          sh scripts/web_build.sh
          python3 scripts/prepare_ios_studio.py
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Debug synthetic fixture
        script: |
          if [ "$CONFIGURATION" = Debug ]; then
            fixture="$SRCROOT/../../renders/fixtures/synthetic-speech.wav"
            digest=$(shasum -a 256 "$fixture" | cut -d ' ' -f 1)
            test "$digest" = c6db8bb92195399e012b1186908798bf345e5a0f3b185f82a3be745759a4410e || exit 1
            cp "$fixture" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/synthetic-speech.wav"
            cp "$SRCROOT/JamloomTests/LocalCredits.storekit" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/LocalCredits.storekit"
          fi
        basedOnDependencyAnalysis: false
  JamloomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JamloomTests]
    dependencies:
      - target: Jamloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djayvo.app.tests
        GENERATE_INFOPLIST_FILE: YES
  JamloomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JamloomUITests]
    dependencies:
      - target: Jamloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djayvo.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Jamloom:
    run:
      config: Debug
      storeKitConfiguration: JamloomTests/LocalCredits.storekit
    build:
      targets:
        Jamloom: all
    test:
      targets:
        - JamloomTests
        - JamloomUITests
      gatherCoverageData: true
