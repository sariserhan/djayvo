name: Build Runpod music worker
on:
  push:
    branches: [codex/runpod-setup]
    paths: [services/runpod/**, scripts/**, assets/manifests/**, .github/workflows/runpod-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify worker boundary contracts
        run: python3 -m unittest discover -s tests -p 'test_runpod_worker.py'
      - name: Free preinstalled SDK space on the disposable build runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image name
        run: echo "WORKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/music-worker" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: services/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "RUNPOD_WORKER_IMAGE=${WORKER_IMAGE}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
