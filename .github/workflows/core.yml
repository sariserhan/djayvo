name: Portable core
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-pro:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify the shared studio inside the sandboxed Mac app, with muted output
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/desktop-pro ci
          npm --prefix apps/desktop-pro run prepare:studio
          npm --prefix apps/desktop-pro test
          npm --prefix apps/desktop-pro run test:app
          node apps/desktop-pro/package.mjs
  website:
    runs-on: ubuntu-24.04
    container: amazonlinux:2023
    timeout-minutes: 20
    steps:
      - name: Install baseline build-image utilities
        run: dnf install -y git make python3 python3-pip tar gzip xz findutils
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check Music DNA contracts without model weights
        run: python3 -m unittest discover -s tests -p 'test_*dna*.py'
      - name: Verify SDK bootstrap handles a partial dependency cache
        run: python3 tests/integration/verify_web_sdk.py
      - name: Build website from tracked sources without a prebuilt studio
        working-directory: apps/site
        run: |
          test ! -d ../../dist/web
          npm ci
          npm run build
          npm test
          npm run audit:bundle
  academy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: academy_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JAMLOOM_TEST_DATABASE_URL: postgresql://postgres:academy_ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify real-deck rubric and isolated Academy payment/progress transactions
        working-directory: apps/site
        run: |
          npm ci
          npm --prefix ../web ci
          npm run studio:prepare
          node --test ../web/tests/*.test.js
          npm run test:academy
          npm run test:admin
          node --import tsx --test tests/pro.test.ts
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        sanitizers: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure and build
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=RelWithDebInfo -DJAMLOOM_SANITIZERS=${{ matrix.sanitizers }} -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build build-ci --parallel 3
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Verify Mac Live Source companion without capturing audio
        if: matrix.os == 'macos-15' && matrix.sanitizers == 'OFF'
        run: swift test --package-path apps/desktop-companion
      - name: Compile iPhone release app
        if: matrix.os == 'macos-15' && matrix.sanitizers == 'OFF'
        run: |
          xcodebuild build -project apps/ios/Jamloom.xcodeproj -scheme Jamloom -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO
          python3 scripts/verify_ios_bundle.py build-ios/Build/Products/Release-iphoneos/Jamloom.app
      - name: Render independent CI control
        if: matrix.sanitizers == 'OFF'
        run: |
          python3 scripts/make_fixture.py --output build-ci/control/source.wav
          ./build-ci/jamloom_remix --input build-ci/control/source.wav --synthetic-fixture --output build-ci/control/remix --style all
          python3 scripts/verify_export.py build-ci/control/remix
          ./build-ci/jamloom_remix --input build-ci/control/source.wav --synthetic-fixture --output build-ci/control/club --style club
          python3 scripts/verify_export.py build-ci/control/club
          uname -a > build-ci/control/toolchain.txt
          c++ --version >> build-ci/control/toolchain.txt
          cmake --version >> build-ci/control/toolchain.txt
          python3 --version >> build-ci/control/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.sanitizers == 'OFF'
        with:
          name: control-${{ matrix.os }}
          path: build-ci/control/
          retention-days: 7
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: control-*
          path: comparison/
      - name: Verify and compare plans, frames and PCM
        run: |
          python3 scripts/verify_export.py comparison/control-ubuntu-24.04/remix
          python3 scripts/verify_export.py comparison/control-macos-15/remix
          python3 scripts/compare_portability.py --reference comparison/control-ubuntu-24.04/remix --candidate comparison/control-macos-15/remix --report comparison/report.json
          python3 scripts/verify_export.py comparison/control-ubuntu-24.04/club
          python3 scripts/verify_export.py comparison/control-macos-15/club
          python3 scripts/compare_portability.py --styles club --reference comparison/control-ubuntu-24.04/club --candidate comparison/control-macos-15/club --report comparison/club-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-comparison
          path: comparison/*report.json
          retention-days: 7
          if-no-files-found: warn
