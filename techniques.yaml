{
  "schema_version": "1.0-r0-techniques",
  "format": "JSON-compatible YAML 1.2",
  "basis": "General compositional/DSP operations observed in the existing shared engine; no performer identities or imitation targets",
  "implementation": [
    "core/arrangement/remix.cpp",
    "core/composition/analysis.cpp",
    "core/audio/remix_renderer.cpp"
  ],
  "grammar_restrictions": {
    "hiphop": "96 BPM, backbeat, swung hats, minor chord vocabulary; not a claim to represent all hip-hop",
    "reggae": "80 BPM, offbeat organ stabs and sparse bass/drum vocabulary; no performer-specific pattern",
    "experimental": "124 BPM, displaced motif and lead responses; intelligibility and enjoyment require listening"
  },
  "unsupported_in_R0": [
    "semantic phoneme/word labels",
    "formant preservation",
    "automatic live tempo/key tracking",
    "polyrhythm inference",
    "live AI override",
    "pitch-contour transcription"
  ],
  "techniques": [
    {
      "id": "phrase_regions",
      "family": "capture",
      "name": "Bound active phrase regions",
      "status": "existing_engine_rule_or_DSP",
      "parameters": {
        "contract": "start/end frames, confidence [0,1]",
        "execution_path": "analysis.phrases",
        "schema_ref": "schemas/remix-plan.schema.json#/properties/analysis/properties/phrases"
      },
      "use_when": [
        "Source contains energy-separated phrases"
      ],
      "failure_modes": [
        "Breaths/noise may be mistaken for boundaries"
      ],
      "engine_actions": [
        "analysis.phrases"
      ],
      "audio_examples": [
        {
          "path": "renders/fixtures/synthetic-speech.wav",
          "start_seconds": 0,
          "end_seconds": 3,
          "purpose": "Context example from original/cleared assets; not an isolated causal ablation or human acceptance"
        }
      ]
    },
    {
      "id": "onset_capture",
      "family": "capture",
      "name": "Locate transient onsets",
      "status": "existing_engine_rule_or_DSP",
      "parameters": {
        "contract": "frame indices within source",
        "execution_path": "analysis.onsets",
        "schema_ref": "schemas/remix-plan.schema.json#/properties/analysis/properties/onsets"
      },
      "use_when": [
        "Rhythm can be inferred from source attacks"
      ],
      "failure_modes": [
        "Speech energy peaks are not semantic syllables"
      ],
      "engine_actions": [
        "analysis.onsets"
      ],
      "audio_examples": [
